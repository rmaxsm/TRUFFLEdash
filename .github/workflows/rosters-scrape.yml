name: Rosters scrape

on:
  schedule:
    # Daily at 12:10 UTC (~5:10am PDT) - rosters can change any day (waivers/trades),
    # unlike week-scoped data. Second in the staggered morning chain (see
    # ids-scrape.yml's comment for why it's off the hour and 3min-spaced).
    - cron: "10 12 * * *"
  workflow_dispatch:
    inputs:
      database:
        description: "MotherDuck DB to write to"
        required: true
        default: "td"
      dry_run:
        description: "Dry Run (Report Diff, No Overwrite)"
        type: boolean
        required: true
        default: false

jobs:
  scrape-rosters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape TRUFFLE + KERFUFFLE rosters
        env:
          CBS_TRUFFLE_COOKIES_JSON: ${{ secrets.CBS_TRUFFLE_COOKIES_JSON }}
          CBS_TRUFFLE_HEADERS_JSON: ${{ secrets.CBS_TRUFFLE_HEADERS_JSON }}
          CBS_KERFUFFLE_COOKIES_JSON: ${{ secrets.CBS_KERFUFFLE_COOKIES_JSON }}
          CBS_KERFUFFLE_HEADERS_JSON: ${{ secrets.CBS_KERFUFFLE_HEADERS_JSON }}
          OMNI_API_KEY: ${{ secrets.OMNI_API_KEY }}
        run: python scrape/rosters.py

      - name: Write current season to MotherDuck
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        # github.event.inputs.* is only ever populated for a workflow_dispatch
        # trigger - on the real `schedule` trigger it's always null, so
        # github.event.inputs.dry_run == 'false' would always be false there
        # too, appending --dry-run on every scheduled run (i.e. the schedule
        # would never really write anything), and the database fallback would
        # always take the '|| ...' branch too. Branching explicitly on
        # github.event_name so the schedule always writes for real to td,
        # while a manual workflow_dispatch left at its own default (dry_run:
        # false, database: td) still does what its form says.
        run: >
          python scrape/rosters_to_motherduck.py
          --database "${{ github.event.inputs.database || 'td' }}"
          ${{ (github.event.inputs.dry_run == 'false' || github.event_name == 'schedule') && ' ' || '--dry-run' }}

      - name: Upload scraped CSVs as artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rosters-csv-${{ github.run_id }}
          path: data/rosters.csv
          retention-days: 30
