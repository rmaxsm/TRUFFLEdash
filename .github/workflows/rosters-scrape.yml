name: Rosters scrape

on:
  schedule:
    # Daily at 12:00 UTC (~8am ET) - rosters can change any day (waivers/trades),
    # unlike week-scoped data.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      database:
        description: "MotherDuck DB to write to"
        required: true
        default: "td"
      dry_run:
        description: "Dry Run (Report Diff, No Overwrite)"
        type: boolean
        required: true
        default: false

jobs:
  scrape-rosters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape TRUFFLE + KERFUFFLE rosters
        env:
          CBS_TRUFFLE_COOKIES_JSON: ${{ secrets.CBS_TRUFFLE_COOKIES_JSON }}
          CBS_TRUFFLE_HEADERS_JSON: ${{ secrets.CBS_TRUFFLE_HEADERS_JSON }}
          CBS_KERFUFFLE_COOKIES_JSON: ${{ secrets.CBS_KERFUFFLE_COOKIES_JSON }}
          CBS_KERFUFFLE_HEADERS_JSON: ${{ secrets.CBS_KERFUFFLE_HEADERS_JSON }}
          OMNI_API_KEY: ${{ secrets.OMNI_API_KEY }}
        run: python scrape/rosters.py

      - name: Write current season to MotherDuck
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: >
          python scrape/rosters_to_motherduck.py
          --database "${{ github.event.inputs.database || 'td_backup_2025' }}"
          ${{ (github.event.inputs.dry_run == 'false') && ' ' || '--dry-run' }}

      - name: Upload scraped CSVs as artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rosters-csv-${{ github.run_id }}
          path: data/rosters.csv
          retention-days: 30
