name: Snaps scrape

on:
  schedule:
    # Last in the staggered morning chain (see ids-scrape.yml's comment for
    # why it's off the hour and 3min-spaced) - all three days run at 12:25
    # UTC (~5:25am PDT).
    #
    # Monday - catches that week's Thursday + Sunday games a day early
    # (Monday Night Football hasn't happened yet, so this run is
    # intentionally incomplete for the week - Tuesday's run fills the gap).
    - cron: "25 12 * * 1"
    # Tuesday - primary weekly scrape: by Tuesday morning, that week's
    # Thursday/Sunday/Monday games are all complete and FantasyPros'
    # official stats have had overnight to finalize.
    - cron: "25 12 * * 2"
    # Friday - secondary scrape: catches that week's Thursday Night Football
    # game early, and re-confirms/catches any late corrections FantasyPros
    # made to the prior week's numbers.
    - cron: "25 12 * * 5"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to scrape (blank = auto-detect from today's date)"
        required: false
        default: ""
      database:
        description: "MotherDuck DB to write to"
        required: true
        default: "td_backup_2025"
      dry_run:
        description: "Dry Run (Report Diff, No Overwrite)"
        type: boolean
        required: true
        default: true

jobs:
  scrape-snaps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Scrape snap counts
        env:
          FANTASYPROS_COOKIES_JSON: ${{ secrets.FANTASYPROS_COOKIES_JSON }}
          FANTASYPROS_HEADERS_JSON: ${{ secrets.FANTASYPROS_HEADERS_JSON }}
        run: >
          python scrape/snaps.py
          ${{ github.event.inputs.season != '' && format('--season {0}', github.event.inputs.season) || '' }}

      - name: Upsert season into MotherDuck
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        # github.event.inputs.* is only ever populated for a workflow_dispatch
        # trigger - on the real `schedule` trigger it's always null, so
        # github.event.inputs.dry_run == 'false' would always be false there
        # too, appending --dry-run on every scheduled run (i.e. the schedule
        # would never really write anything). Branching explicitly on
        # github.event_name so the schedule always writes for real to td,
        # while a manual workflow_dispatch left at its own default (database:
        # td_backup_2025, dry_run: true) still does the safe test-first thing.
        run: >
          python scrape/snaps_to_motherduck.py
          ${{ github.event.inputs.season != '' && format('--season {0}', github.event.inputs.season) || '' }}
          --database "${{ github.event.inputs.database || 'td' }}"
          ${{ (github.event.inputs.dry_run == 'false' || github.event_name == 'schedule') && ' ' || '--dry-run' }}

      - name: Upload scraped CSV as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snapper-csv-${{ github.run_id }}
          path: data/snapPer.csv
          retention-days: 30
