name: IDs scrape

on:
  schedule:
    # Daily at 12:07 UTC (~5:07am PDT) - evergreen crosswalk, no season/week
    # concept. First in the staggered morning chain (see rosters/weekly/
    # transactions/fantasy/opt-lineups/snaps) - offset from the top of the
    # hour and spread 3min apart from the others to avoid GitHub Actions'
    # exact-on-the-hour queue congestion, which was previously delaying
    # these runs by 3-5 hours. Tuned for PDT; will drift ~1hr earlier once
    # PST resumes in November.
    - cron: "7 12 * * *"
  workflow_dispatch:
    inputs:
      database:
        description: "MotherDuck DB to write to"
        required: true
        default: "td"
      dry_run:
        description: "Dry Run (Report Diff, No Overwrite)"
        type: boolean
        required: true
        default: false

jobs:
  scrape-ids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape player IDs
        env:
          CBS_TRUFFLE_COOKIES_JSON: ${{ secrets.CBS_TRUFFLE_COOKIES_JSON }}
          CBS_TRUFFLE_HEADERS_JSON: ${{ secrets.CBS_TRUFFLE_HEADERS_JSON }}
        run: python scrape/playerIDs.py

      - name: Replace ids table in MotherDuck
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        # github.event.inputs.* is only ever populated for a workflow_dispatch
        # trigger - on the real `schedule` trigger it's always null, so
        # github.event.inputs.dry_run == 'false' would always be false there
        # too, appending --dry-run on every scheduled run (i.e. the schedule
        # would never really write anything). Branching explicitly on
        # github.event_name so the schedule always writes for real to td,
        # while a manual workflow_dispatch left at its own default (dry_run:
        # false, database: td) still does what its form says.
        run: >
          python scrape/ids_to_motherduck.py
          --database "${{ github.event.inputs.database || 'td' }}"
          ${{ (github.event.inputs.dry_run == 'false' || github.event_name == 'schedule') && ' ' || '--dry-run' }}

      - name: Upload scraped CSV as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playerids-csv-${{ github.run_id }}
          path: data/playerIDs.csv
          retention-days: 30
