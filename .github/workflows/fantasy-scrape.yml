name: Fantasy scrape

on:
  schedule:
    # Daily at 12:19 UTC (~5:19am PDT) during the NFL season, except Wednesdays -
    # lineups are locked well before that week's games start, so re-scraping
    # the just-finished week on Wednesday (weekly-scrape.yml's correction-run
    # day) has nothing new to catch, and the next week's lineups aren't set
    # that early either. Day-of-week 3 = Wednesday.
    #
    # Fifth in the staggered morning chain (see ids-scrape.yml's comment for
    # why it's off the hour and 3min-spaced).
    - cron: "19 12 * * 0,1,2,4,5,6"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to scrape (blank = auto-detect from today's date via the ESPN calendar)"
        required: false
        default: ""
      week:
        description: "Week to scrape (blank = auto-detect from today's date via the ESPN calendar)"
        required: false
        default: ""
      which:
        description: "Which calendar week to auto-detect when season/week are blank"
        type: choice
        options:
          - current
          - previous
        default: current
      database:
        description: "MotherDuck DB to write to"
        required: true
        default: "td_backup_2025"
      dry_run:
        description: "Dry Run (Report Diff, No Overwrite)"
        type: boolean
        required: true
        default: true

jobs:
  scrape-fantasy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check NFL season is active
        id: check_season
        if: github.event_name == 'schedule'
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, 'scrape')
          from cbs_scrape_utils import get_calendar_week
          try:
              get_calendar_week()
              print('in_season=true')
          except ValueError as e:
              print(f'::notice::Skipping scheduled run - {e}')
              print('in_season=false')
          " >> "$GITHUB_OUTPUT"

      - name: Scrape + upsert current week
        if: github.event_name != 'schedule' || steps.check_season.outputs.in_season == 'true'
        env:
          CBS_TRUFFLE_COOKIES_JSON: ${{ secrets.CBS_TRUFFLE_COOKIES_JSON }}
          CBS_TRUFFLE_HEADERS_JSON: ${{ secrets.CBS_TRUFFLE_HEADERS_JSON }}
          CBS_KERFUFFLE_COOKIES_JSON: ${{ secrets.CBS_KERFUFFLE_COOKIES_JSON }}
          CBS_KERFUFFLE_HEADERS_JSON: ${{ secrets.CBS_KERFUFFLE_HEADERS_JSON }}
          OMNI_API_KEY: ${{ secrets.OMNI_API_KEY }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        # github.event.inputs.* is only ever populated for a workflow_dispatch
        # trigger - on the real `schedule` trigger it's always null, so
        # github.event.inputs.dry_run == 'false' would always be false there
        # too, appending --dry-run on every scheduled run (i.e. the schedule
        # would never really write anything). Branching explicitly on
        # github.event_name so the schedule always writes for real to td,
        # while a manual workflow_dispatch left at its own default (database:
        # td_backup_2025, dry_run: true) still does the safe test-first thing.
        run: >
          python scrape/fantasy_to_motherduck.py
          ${{ github.event.inputs.season != '' && format('--season {0}', github.event.inputs.season) || '' }}
          ${{ github.event.inputs.week != '' && format('--week {0}', github.event.inputs.week) || '' }}
          --which "${{ github.event.inputs.which || 'current' }}"
          --database "${{ github.event.inputs.database || 'td' }}"
          ${{ (github.event.inputs.dry_run == 'false' || github.event_name == 'schedule') && ' ' || '--dry-run' }}

      - name: Upload scraped CSV as artifact
        if: always() && (github.event_name != 'schedule' || steps.check_season.outputs.in_season == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: fantasy-csv-${{ github.run_id }}
          path: data/fantasy_scraperesult.csv
          retention-days: 30
          if-no-files-found: warn
